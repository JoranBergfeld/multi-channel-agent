<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Conversation Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16202d;
        --muted: #5f6b7a;
        --line: #d7dde5;
        --surface: #ffffff;
        --surface-soft: #f6f8fb;
        --page-bg: #eef2f7;
        --accent: #2563eb;
        --accent-soft: #e8f0ff;
        --success: #166534;
        --success-soft: #e7f7ed;
        --danger-soft: #fce8e8;
        --shadow: 0 10px 30px rgba(22, 32, 45, 0.08);
        --radius: 16px;
        --radius-sm: 12px;
        --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.22);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--page-bg);
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--page-bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.5;
        overflow-x: hidden;
      }

      img,
      svg,
      video,
      canvas {
        display: block;
        max-width: 100%;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.75rem 1rem;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 1px 0 rgba(22, 32, 45, 0.02);
      }

      button:hover {
        border-color: #b9c4d3;
        background: #fdfefe;
      }

      button:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
        border-color: var(--accent);
      }

      button[data-channel],
      #scenario-tabs button,
      [data-reset-walkthrough],
      [data-next-step],
      [data-free-play-index] {
        min-height: 2.75rem;
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }

      header {
        max-width: 72rem;
        margin-bottom: 1.5rem;
      }

      header p:first-of-type {
        margin: 0 0 0.5rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.8rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      header p:last-of-type {
        margin: 0.75rem 0 0;
        max-width: 60rem;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .scenario-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.25rem 0 1rem;
      }

      .scenario-tabs button[aria-current="page"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: #113a8c;
        box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.18);
        font-weight: 700;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(19rem, 1fr);
        gap: 1rem;
        align-items: start;
      }

      .conversation-panel,
      .state-column > section,
      .free-play {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .conversation-panel {
        padding: 1.25rem;
        min-width: 0;
      }

      .conversation-panel h2,
      .state-column h2,
      .free-play h2 {
        margin: 0;
        font-size: 1.2rem;
        line-height: 1.25;
      }

      .conversation-panel > p {
        margin: 0.75rem 0 1rem;
        color: var(--muted);
      }

      .channel-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.85rem;
      }

      .channel-buttons button {
        min-width: 6rem;
        background: var(--surface);
      }

      .channel-buttons button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: #113a8c;
        box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.18);
        font-weight: 700;
      }

      #transcript {
        margin-top: 1rem;
        min-height: 20rem;
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-soft);
      }

      #transcript > p {
        min-height: 16rem;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }

      .transcript-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .transcript-turn {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 0.4rem;
        max-width: 80%;
        padding: 0.85rem 1rem;
        border-radius: 1rem;
        border: 1px solid var(--line);
        background: var(--surface);
        overflow-wrap: anywhere;
        word-break: normal;
      }

      .transcript-turn strong {
        flex: none;
      }

      .transcript-turn span {
        min-width: 0;
      }

      .transcript-turn.user-turn {
        margin-left: auto;
        border-color: rgba(37, 99, 235, 0.24);
        background: var(--accent-soft);
        justify-content: flex-end;
      }

      .transcript-turn.agent-turn {
        margin-right: auto;
        background: var(--surface);
      }

      #walkthrough-controls {
        margin-top: 1rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      #walkthrough-controls p,
      #walkthrough-controls p {
        margin: 0;
        color: var(--success);
        font-weight: 600;
      }

      .free-play > p {
        margin: 0;
        color: var(--muted);
      }

      .secondary {
        background: var(--surface);
      }

      .state-column {
        display: grid;
        gap: 1rem;
        min-width: 0;
      }

      .state-column > section {
        padding: 1rem 1rem 1.15rem;
        min-width: 0;
      }

      .state-column dl {
        display: grid;
        grid-template-columns: minmax(0, 9rem) minmax(0, 1fr);
        gap: 0.6rem 0.9rem;
        margin: 0.85rem 0 0;
      }

      .state-column dt {
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .state-column dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .state-column table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        margin-top: 0.85rem;
        font-size: 0.95rem;
      }

      .state-column thead th {
        padding: 0.7rem 0.65rem;
        text-align: left;
        background: var(--surface-soft);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .state-column tbody th,
      .state-column tbody td {
        padding: 0.65rem 0.65rem;
        border-bottom: 1px solid #e5eaf0;
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      .state-column tbody th {
        text-align: left;
        font-weight: 600;
      }

      .zero-entry {
        background: var(--danger-soft);
        color: #8b1f1f;
      }

      .zero-entry th,
      .zero-entry td {
        color: inherit;
      }

      #transition-explanation {
        border-color: rgba(37, 99, 235, 0.34);
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      }

      #transition-explanation::before {
        content: "Transition";
        display: inline-block;
        margin-bottom: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #113a8c;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      #free-play-controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .free-play {
        margin-top: 1rem;
        padding: 1rem;
      }

      .free-play > p {
        margin-top: 0.85rem;
      }

      .free-play button {
        width: 100%;
        justify-content: center;
      }

      @media (max-width: 960px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }

        .state-column {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        #transition-explanation {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 600px) {
        .page {
          padding: 1rem 0.75rem 2rem;
        }

        header {
          margin-bottom: 1rem;
        }

        .conversation-panel,
        .state-column > section,
        .free-play {
          padding: 1rem;
        }

        .channel-buttons,
        #walkthrough-controls {
          align-items: stretch;
        }

        .channel-buttons button,
        #walkthrough-controls button,
        #walkthrough-controls .secondary {
          width: 100%;
        }

        .transcript-turn {
          max-width: 100%;
        }

        .state-column {
          grid-template-columns: 1fr;
        }

        .state-column dl {
          grid-template-columns: 1fr;
          gap: 0.25rem 0;
        }

        .state-column dt {
          margin-top: 0.25rem;
        }

        .state-column thead th,
        .state-column tbody th,
        .state-column tbody td {
          padding-left: 0.5rem;
          padding-right: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <p>Throwaway logic prototype</p>
        <h1>Inventory conversations in text and voice</h1>
        <p>This prototype tests one balanced mutation policy across text and voice while adapting confirmations, clarification, and result length.</p>
      </header>

      <nav id="scenario-tabs" class="scenario-tabs" aria-label="Guided walkthroughs"></nav>

      <section class="workspace">
        <section class="conversation-panel">
          <h2 id="scenario-title"></h2>
          <div class="channel-buttons" role="group" aria-label="Channel selection">
            <button type="button" data-channel="text">Text</button>
            <button type="button" data-channel="voice">Voice</button>
          </div>
          <p id="scenario-description"></p>
          <div id="transcript" aria-live="polite"></div>
          <div id="walkthrough-controls"></div>
        </section>

        <aside class="state-column">
          <section id="conversation-state" aria-label="Conversation state"></section>
          <section id="inventory-state" aria-label="Inventory state"></section>
          <section id="transition-explanation" aria-label="Transition explanation"></section>
        </aside>
      </section>

      <section class="free-play">
        <div id="free-play-controls"></div>
        <p>These controls use the same reducer.</p>
      </section>
    </main>

    <script>
      const createSeedInventory = () => ({
        entries: [
          { id: "gloves", name: "Nitrile gloves", quantity: 6, unit: "boxes", location: "Garage", note: "" },
          { id: "aa-batteries", name: "AA batteries", quantity: 24, unit: "each", location: "Garage", note: "" },
          { id: "aaa-batteries", name: "AAA batteries", quantity: 18, unit: "each", location: "Utility room", note: "" },
          { id: "white-paint", name: "White wall paint", quantity: 2, unit: "cans", location: "Garage", note: "" },
          { id: "blue-paint", name: "Blue wall paint", quantity: 1, unit: "can", location: "Garage", note: "" },
          { id: "primer", name: "Primer", quantity: 3, unit: "cans", location: "Garage", note: "For wall paint" },
          { id: "screws", name: "Wood screws", quantity: 48, unit: "each", location: "Garage", note: "40 mm" },
          { id: "filters", name: "Air filters", quantity: 4, unit: "boxes", location: "Garage", note: "" },
          { id: "tape", name: "Masking tape", quantity: 8, unit: "rolls", location: "Garage", note: "" },
          { id: "sandpaper", name: "Sandpaper", quantity: 12, unit: "sheets", location: "Garage", note: "120 grit" },
          { id: "oil", name: "Machine oil", quantity: 2, unit: "bottles", location: "Garage", note: "" },
          { id: "brushes", name: "Paint brushes", quantity: 7, unit: "each", location: "Garage", note: "" },
          { id: "rags", name: "Cleaning rags", quantity: 15, unit: "each", location: "Garage", note: "" },
          { id: "anchors", name: "Wall anchors", quantity: 30, unit: "each", location: "Garage", note: "" },
          { id: "sealant", name: "Silicone sealant", quantity: 5, unit: "tubes", location: "Garage", note: "" },
          { id: "extension-cords", name: "Extension cords", quantity: 3, unit: "each", location: "Garage", note: "" },
        ],
      });

      const ConversationStatus = Object.freeze({
        IDLE: "idle",
        UNDERSTANDING: "understanding",
        CLARIFYING: "clarifying",
        CONFIRMING: "confirming",
        APPLIED: "applied",
        FAILED: "failed",
      });

      const createInitialState = (channel = "text") => ({
        inventory: createSeedInventory(),
        channel,
        status: ConversationStatus.IDLE,
        pendingIntent: null,
        candidates: [],
        proposedMutations: [],
        uncertainFields: [],
        transcript: [],
        lastResponse: "Choose a walkthrough or a free-play action.",
        transition: "The prototype is ready.",
      });

      const updateEntry = (inventory, entryId, update) => ({
        ...inventory,
        entries: inventory.entries.map((entry) =>
          entry.id === entryId ? { ...entry, ...update(entry) } : entry
        ),
      });

      const appendTurn = (state, speaker, text) => ({
        ...state,
        transcript: [...state.transcript, { speaker, text }],
      });

      const withAgentResponse = (state, text, transition) => ({
        ...appendTurn(state, "Agent", text),
        lastResponse: text,
        transition,
      });

      const formatQuantity = (quantity, unit) => `${quantity} ${unit}`;

      const Responses = {
        added(channel, entry, amount, resultingQuantity) {
          if (channel === "voice") {
            return `Added ${formatQuantity(amount, entry.unit)} in the ${entry.location.toLowerCase()}. You now have ${resultingQuantity}.`;
          }
          return `Added ${formatQuantity(amount, entry.unit)} of ${entry.name} in the ${entry.location}. You now have ${formatQuantity(resultingQuantity, entry.unit)}.`;
        },

        ambiguousBatteries(channel) {
          if (channel === "voice") {
            return "AA batteries in the garage, or AAA batteries in the utility room?";
          }
          return "Which batteries: 1. AA batteries — 24 each, Garage; or 2. AAA batteries — 18 each, Utility room?";
        },

        removed(channel, entry, amount, resultingQuantity) {
          if (channel === "voice") {
            return `Removed ${amount}. ${resultingQuantity} ${entry.name} remain in the ${entry.location.toLowerCase()}.`;
          }
          return `Removed ${formatQuantity(amount, entry.unit)} of ${entry.name} from the ${entry.location}. ${formatQuantity(resultingQuantity, entry.unit)} remain.`;
        },

        bulkPreview(channel, mutations) {
          if (channel === "voice") {
            const names = mutations.map((mutation) => mutation.name.toLowerCase());
            return `That affects ${mutations.length} entries: ${names.slice(0, -1).join(", ")}, and ${names.at(-1)}. All would become zero. Should I apply that?`;
          }
          const details = mutations
            .map((mutation) => `${mutation.name}: ${mutation.before} ${mutation.unit} → 0`)
            .join("; ");
          return `This will set ${mutations.length} Stock Entries to zero: ${details}. Apply these changes?`;
        },

        bulkApplied(channel, count) {
          return channel === "voice"
            ? `Done. All ${count} entries are now zero.`
            : `Applied the bulk Set. ${count} Stock Entries are now zero.`;
        },

        garageList(channel, entries) {
          if (channel === "voice") {
            const largest = [...entries]
              .sort((left, right) => right.quantity - left.quantity)
              .slice(0, 3)
              .map((entry) => `${entry.quantity} ${entry.name.toLowerCase()}`);
            return `You have ${entries.length} on-hand entries in the garage. The largest quantities are ${largest.join(", ")}. Want the full list, or should I narrow it?`;
          }
          return entries
            .map((entry) => `${entry.name}: ${formatQuantity(entry.quantity, entry.unit)}`)
            .join(" · ");
        },

        uncertainQuantity() {
          return "Was that fifteen boxes or fifty boxes?";
        },

        insufficient(entry, requested) {
          return `I couldn't remove ${requested}. Only ${formatQuantity(entry.quantity, entry.unit)} of ${entry.name} are on hand.`;
        },
      };

      const ConversationPrototype = (() => {
        const paintIds = ["white-paint", "blue-paint", "primer"];

        const receive = (state, utterance) =>
          appendTurn(
            { ...state, status: ConversationStatus.UNDERSTANDING },
            "You",
            utterance
          );

        const applyAdd = (state, entryId, amount) => {
          const entry = state.inventory.entries.find((candidate) => candidate.id === entryId);
          const resultingQuantity = entry.quantity + amount;
          const nextState = {
            ...state,
            inventory: updateEntry(state.inventory, entryId, (current) => ({
              quantity: current.quantity + amount,
            })),
            status: ConversationStatus.APPLIED,
            pendingIntent: null,
            uncertainFields: [],
          };
          return withAgentResponse(
            nextState,
            Responses.added(state.channel, entry, amount, resultingQuantity),
            `Applied Add to ${entry.name}: ${entry.quantity} → ${resultingQuantity} ${entry.unit}.`
          );
        };

        const applyRemove = (state, entryId, amount) => {
          const entry = state.inventory.entries.find((candidate) => candidate.id === entryId);
          if (amount > entry.quantity) {
            return withAgentResponse(
              {
                ...state,
                status: ConversationStatus.FAILED,
                pendingIntent: null,
                candidates: [],
              },
              Responses.insufficient(entry, amount),
              "Rejected Remove; Inventory is unchanged because the requested amount exceeds On-hand Stock."
            );
          }

          const resultingQuantity = entry.quantity - amount;
          const nextState = {
            ...state,
            inventory: updateEntry(state.inventory, entryId, (current) => ({
              quantity: current.quantity - amount,
            })),
            status: ConversationStatus.APPLIED,
            pendingIntent: null,
            candidates: [],
          };
          return withAgentResponse(
            nextState,
            Responses.removed(state.channel, entry, amount, resultingQuantity),
            `Applied Remove to ${entry.name}: ${entry.quantity} → ${resultingQuantity} ${entry.unit}.`
          );
        };

        const reducer = (state, action) => {
          switch (action.type) {
            case "SET_CHANNEL":
              return {
                ...state,
                channel: action.channel,
                transition: `Changed presentation to ${action.channel}; mutation policy is unchanged.`,
              };

            case "RESET":
              return createInitialState(action.channel ?? state.channel);

            case "START_ADD": {
              const understood = receive(state, "Add 4 boxes of nitrile gloves to the garage.");
              return applyAdd(understood, "gloves", 4);
            }

            case "START_AMBIGUOUS_REMOVE": {
              const understood = receive(state, "Remove 2 batteries.");
              return withAgentResponse(
                {
                  ...understood,
                  status: ConversationStatus.CLARIFYING,
                  pendingIntent: { kind: "remove", amount: 2 },
                  candidates: ["aa-batteries", "aaa-batteries"],
                },
                Responses.ambiguousBatteries(state.channel),
                "Paused before mutation because the reference has two Matches."
              );
            }

            case "CHOOSE_MATCH": {
              if (
                state.status !== ConversationStatus.CLARIFYING ||
                state.pendingIntent?.kind !== "remove" ||
                !state.candidates.includes(action.entryId)
              ) {
                return state;
              }
              const entry = state.inventory.entries.find(
                (candidate) => candidate.id === action.entryId
              );
              if (!entry) {
                return state;
              }
              const clarified = appendTurn(state, "You", entry.name);
              return applyRemove(clarified, action.entryId, state.pendingIntent.amount);
            }

            case "START_BULK_SET": {
              const understood = receive(state, "Set all garage paint to zero.");
              const proposedMutations = understood.inventory.entries
                .filter((entry) => paintIds.includes(entry.id))
                .map((entry) => ({
                  entryId: entry.id,
                  name: entry.name,
                  unit: entry.unit,
                  before: entry.quantity,
                  after: 0,
                }));
              return withAgentResponse(
                {
                  ...understood,
                  status: ConversationStatus.CONFIRMING,
                  pendingIntent: { kind: "bulk-set-zero" },
                  proposedMutations,
                },
                Responses.bulkPreview(state.channel, proposedMutations),
                "Prepared an exact atomic preview; Inventory is unchanged until explicit confirmation."
              );
            }

            case "CONFIRM_MUTATION": {
              if (
                state.status !== ConversationStatus.CONFIRMING ||
                state.pendingIntent?.kind !== "bulk-set-zero"
              ) {
                return state;
              }
              const confirmed = appendTurn(state, "You", "Yes, apply it.");
              const ids = new Set(
                confirmed.proposedMutations.map((mutation) => mutation.entryId)
              );
              const inventory = {
                ...confirmed.inventory,
                entries: confirmed.inventory.entries.map((entry) =>
                  ids.has(entry.id) ? { ...entry, quantity: 0 } : entry
                ),
              };
              return withAgentResponse(
                {
                  ...confirmed,
                  inventory,
                  status: ConversationStatus.APPLIED,
                  pendingIntent: null,
                  proposedMutations: [],
                },
                Responses.bulkApplied(state.channel, ids.size),
                `Atomically set ${ids.size} Stock Entries to zero.`
              );
            }

            case "CANCEL_MUTATION": {
              if (state.status !== ConversationStatus.CONFIRMING) {
                return state;
              }
              const cancelled = appendTurn(state, "You", "No, cancel.");
              return withAgentResponse(
                {
                  ...cancelled,
                  status: ConversationStatus.IDLE,
                  pendingIntent: null,
                  proposedMutations: [],
                },
                "Cancelled. Nothing changed.",
                "Cleared the proposed mutation; Inventory is unchanged."
              );
            }

            case "START_GARAGE_LIST": {
              const understood = receive(state, "What do I have in the garage?");
              const entries = understood.inventory.entries.filter(
                (entry) => entry.location === "Garage" && entry.quantity > 0
              );
              return withAgentResponse(
                {
                  ...understood,
                  status: ConversationStatus.APPLIED,
                  pendingIntent:
                    state.channel === "voice"
                      ? {
                          kind: "garage-list",
                          entryIds: entries.map((entry) => entry.id),
                        }
                      : null,
                },
                Responses.garageList(state.channel, entries),
                state.channel === "voice"
                  ? "Returned a spoken summary and preserved the result set for progressive disclosure."
                  : "Returned the complete filtered List."
              );
            }

            case "REQUEST_FULL_LIST": {
              if (state.pendingIntent?.kind !== "garage-list") {
                return state;
              }
              const entries = state.pendingIntent.entryIds.map((entryId) =>
                state.inventory.entries.find((entry) => entry.id === entryId)
              );
              const requested = appendTurn(state, "You", "Read the full list.");
              return withAgentResponse(
                { ...requested, pendingIntent: null },
                entries
                  .map(
                    (entry) =>
                      `${entry.name}, ${formatQuantity(entry.quantity, entry.unit)}`
                  )
                  .join("; "),
                "Expanded the preserved List result without rerunning or changing Inventory."
              );
            }

            case "START_UNCERTAIN_QUANTITY": {
              const understood = receive(
                state,
                "Add [fifteen or fifty] boxes of air filters."
              );
              return withAgentResponse(
                {
                  ...understood,
                  status: ConversationStatus.CLARIFYING,
                  pendingIntent: { kind: "add", entryId: "filters" },
                  uncertainFields: ["quantity"],
                },
                Responses.uncertainQuantity(),
                "Paused before mutation because Quantity recognition is uncertain; the rest of the intent is preserved."
              );
            }

            case "CLARIFY_QUANTITY": {
              if (
                state.pendingIntent?.kind !== "add" ||
                !state.uncertainFields.includes("quantity") ||
                ![15, 50].includes(action.quantity)
              ) {
                return state;
              }
              const clarified = appendTurn(state, "You", `${action.quantity} boxes.`);
              return applyAdd(clarified, state.pendingIntent.entryId, action.quantity);
            }

            case "START_EXCESSIVE_REMOVE": {
              const understood = receive(state, "Remove 30 AA batteries.");
              return applyRemove(understood, "aa-batteries", 30);
            }

            case "INTERRUPT": {
              const interrupted = appendTurn(state, "You", action.utterance);
              return withAgentResponse(
                {
                  ...interrupted,
                  status: ConversationStatus.IDLE,
                  pendingIntent: null,
                  candidates: [],
                  proposedMutations: [],
                  uncertainFields: [],
                },
                "Okay. I cleared the unfinished change. What would you like to do instead?",
                "Discarded the stale pending mutation before accepting a new unrelated intent."
              );
            }

            default:
              return state;
          }
        };

        return { createInitialState, reducer };
      })();

      const walkthroughs = [
        {
          id: "clear-add",
          title: "Clear Add",
          description:
            "One clear Match applies immediately, without clarification or confirmation.",
          steps: [
            { action: { type: "START_ADD" }, label: "Send clear Add" },
          ],
        },
        {
          id: "ambiguous-remove",
          title: "Ambiguous Remove",
          description:
            "Multiple Matches pause the Remove so the Agent can ask for the minimal distinction.",
          steps: [
            {
              action: { type: "START_AMBIGUOUS_REMOVE" },
              label: "Ask to remove batteries",
            },
            {
              action: { type: "CHOOSE_MATCH", entryId: "aa-batteries" },
              label: "Choose AA batteries",
            },
          ],
        },
        {
          id: "bulk-set",
          title: "Bulk Set",
          description:
            "Plural scope produces an exact atomic preview and requires explicit confirmation.",
          steps: [
            {
              action: { type: "START_BULK_SET" },
              label: "Ask to zero garage paint",
            },
            {
              action: { type: "CONFIRM_MUTATION" },
              label: "Confirm the preview",
            },
          ],
        },
        {
          id: "garage-list",
          title: "Garage List",
          description:
            "Text returns the full List, while voice starts with a summary and supports progressive disclosure.",
          steps: [
            {
              action: { type: "START_GARAGE_LIST" },
              label: "Ask what is in the garage",
            },
            {
              action: { type: "REQUEST_FULL_LIST" },
              label: "Request full spoken List",
              voiceOnly: true,
            },
          ],
        },
      ];

      const freePlayActions = [
        {
          label: "Ambiguous Remove",
          action: { type: "START_AMBIGUOUS_REMOVE" },
        },
        {
          label: "Choose AAA batteries",
          action: { type: "CHOOSE_MATCH", entryId: "aaa-batteries" },
        },
        {
          label: "Preview bulk Set",
          action: { type: "START_BULK_SET" },
        },
        {
          label: "Confirm pending mutation",
          action: { type: "CONFIRM_MUTATION" },
        },
        {
          label: "Cancel pending mutation",
          action: { type: "CANCEL_MUTATION" },
        },
        {
          label: "Uncertain spoken Quantity",
          action: { type: "START_UNCERTAIN_QUANTITY" },
        },
        {
          label: "Clarify as 15 boxes",
          action: { type: "CLARIFY_QUANTITY", quantity: 15 },
        },
        {
          label: "Clarify as 50 boxes",
          action: { type: "CLARIFY_QUANTITY", quantity: 50 },
        },
        {
          label: "Remove too many batteries",
          action: { type: "START_EXCESSIVE_REMOVE" },
        },
        {
          label: "Interrupt pending turn",
          action: {
            type: "INTERRUPT",
            utterance: "Actually, tell me about something unrelated.",
          },
        },
      ];

      let activeWalkthroughId = walkthroughs[0].id;
      let completedStepCount = 0;
      let state = ConversationPrototype.createInitialState();

      const elements = {
        scenarioTabs: document.getElementById("scenario-tabs"),
        scenarioTitle: document.getElementById("scenario-title"),
        scenarioDescription: document.getElementById("scenario-description"),
        transcript: document.getElementById("transcript"),
        walkthroughControls: document.getElementById("walkthrough-controls"),
        conversationState: document.getElementById("conversation-state"),
        inventoryState: document.getElementById("inventory-state"),
        transitionExplanation: document.getElementById("transition-explanation"),
        freePlayControls: document.getElementById("free-play-controls"),
        channelButtons: [...document.querySelectorAll("[data-channel]")],
      };

      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character]
        );

      const dispatch = (action) => {
        state = ConversationPrototype.reducer(state, action);
        render();
      };

      const getActiveWalkthrough = () =>
        walkthroughs.find(
          (walkthrough) => walkthrough.id === activeWalkthroughId
        );

      const getNextVisibleStep = (walkthrough) => {
        for (
          let stepIndex = completedStepCount;
          stepIndex < walkthrough.steps.length;
          stepIndex += 1
        ) {
          const step = walkthrough.steps[stepIndex];
          if (step.voiceOnly && state.channel !== "voice") {
            continue;
          }
          if (
            step.action.type === "REQUEST_FULL_LIST" &&
            state.pendingIntent?.kind !== "garage-list"
          ) {
            continue;
          }
          return { step, stepIndex };
        }
        return null;
      };

      const renderScenarioTabs = () => {
        elements.scenarioTabs.innerHTML = walkthroughs
          .map(
            (walkthrough) => `
              <button
                type="button"
                data-scenario="${escapeHtml(walkthrough.id)}"
                aria-current="${
                  walkthrough.id === activeWalkthroughId ? "page" : "false"
                }"
              >${escapeHtml(walkthrough.title)}</button>
            `
          )
          .join("");

        elements.scenarioTabs
          .querySelectorAll("[data-scenario]")
          .forEach((button) => {
            button.addEventListener("click", () => {
              activeWalkthroughId = button.dataset.scenario;
              completedStepCount = 0;
              state = ConversationPrototype.createInitialState(state.channel);
              render();
            });
          });
      };

      const renderTranscript = () => {
        if (state.transcript.length === 0) {
          elements.transcript.innerHTML =
            "<p>Press the next walkthrough step to begin.</p>";
          return;
        }

        elements.transcript.innerHTML = `
          <ol class="transcript-list">
            ${state.transcript
              .map((turn) => {
                const speakerClass =
                  turn.speaker === "You" ? "user-turn" : "agent-turn";
                return `
                  <li class="transcript-turn ${speakerClass}">
                    <strong>${escapeHtml(turn.speaker)}:</strong>
                    <span>${escapeHtml(turn.text)}</span>
                  </li>
                `;
              })
              .join("")}
          </ol>
        `;
      };

      const renderConversationState = () => {
        const candidateNames = state.candidates.map((candidateId) => {
          const entry = state.inventory.entries.find(
            (candidate) => candidate.id === candidateId
          );
          return entry?.name ?? candidateId;
        });
        const pendingIntent =
          state.pendingIntent === null
            ? "None"
            : JSON.stringify(state.pendingIntent);

        elements.conversationState.innerHTML = `
          <h2>Conversation state</h2>
          <dl>
            <dt>Channel</dt>
            <dd>${escapeHtml(state.channel)}</dd>
            <dt>Status</dt>
            <dd>${escapeHtml(state.status)}</dd>
            <dt>Pending intent</dt>
            <dd>${escapeHtml(pendingIntent)}</dd>
            <dt>Candidate Matches</dt>
            <dd>${escapeHtml(candidateNames.length ? candidateNames.join(", ") : "None")}</dd>
            <dt>Proposed mutations</dt>
            <dd>${escapeHtml(state.proposedMutations.length)}</dd>
            <dt>Uncertain fields</dt>
            <dd>${escapeHtml(
              state.uncertainFields.length
                ? state.uncertainFields.join(", ")
                : "None"
            )}</dd>
          </dl>
        `;
      };

      const renderInventory = () => {
        elements.inventoryState.innerHTML = `
          <h2>Inventory state</h2>
          <table>
            <thead>
              <tr>
                <th scope="col">Stock Entry</th>
                <th scope="col">Quantity</th>
                <th scope="col">Location</th>
              </tr>
            </thead>
            <tbody>
              ${state.inventory.entries
                .map(
                  (entry) => `
                    <tr${entry.quantity === 0 ? ' class="zero-entry"' : ""}>
                      <th scope="row">${escapeHtml(entry.name)}</th>
                      <td>${escapeHtml(formatQuantity(entry.quantity, entry.unit))}</td>
                      <td>${escapeHtml(entry.location)}</td>
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
        `;
      };

      const renderWalkthroughControls = (walkthrough) => {
        const next = getNextVisibleStep(walkthrough);
        elements.walkthroughControls.innerHTML = `
          <button type="button" class="secondary" data-reset-walkthrough>
            Reset walkthrough
          </button>
          ${
            next
              ? `<button type="button" data-next-step>${escapeHtml(next.step.label)}</button>`
              : "<p>Walkthrough complete — use free play or reset.</p>"
          }
        `;

        elements.walkthroughControls
          .querySelector("[data-reset-walkthrough]")
          .addEventListener("click", () => {
            completedStepCount = 0;
            dispatch({ type: "RESET", channel: state.channel });
          });

        const nextButton =
          elements.walkthroughControls.querySelector("[data-next-step]");
        if (nextButton && next) {
          nextButton.addEventListener("click", () => {
            completedStepCount = next.stepIndex + 1;
            dispatch(next.step.action);
          });
        }
      };

      const renderFreePlayControls = () => {
        elements.freePlayControls.innerHTML = `
          <h2>Free play</h2>
          ${freePlayActions
            .map(
              (item, index) => `
                <button type="button" data-free-play-index="${index}">
                  ${escapeHtml(item.label)}
                </button>
              `
            )
            .join("")}
        `;

        elements.freePlayControls
          .querySelectorAll("[data-free-play-index]")
          .forEach((button) => {
            button.addEventListener("click", () => {
              const item = freePlayActions[Number(button.dataset.freePlayIndex)];
              dispatch(item.action);
            });
          });
      };

      const render = () => {
        const walkthrough = getActiveWalkthrough();
        elements.scenarioTitle.textContent = walkthrough.title;
        elements.scenarioDescription.textContent = walkthrough.description;
        elements.transitionExplanation.textContent = state.transition;
        elements.channelButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.channel === state.channel)
          );
        });
        renderScenarioTabs();
        renderTranscript();
        renderConversationState();
        renderInventory();
        renderWalkthroughControls(walkthrough);
        renderFreePlayControls();
      };

      elements.channelButtons.forEach((button) => {
        button.addEventListener("click", () => {
          dispatch({ type: "SET_CHANNEL", channel: button.dataset.channel });
        });
      });

      render();
    </script>
  </body>
</html>
