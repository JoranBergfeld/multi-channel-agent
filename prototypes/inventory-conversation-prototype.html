            <button type="button" data-channel="voice">Voice</button>
          </div>
          <p id="scenario-description"></p>
          <div id="transcript"></div>
          <div id="walkthrough-controls"></div>
        </section>

        <aside class="state-column">
          <section id="conversation-state"></section>
          <section id="inventory-state"></section>
          <section id="transition-explanation"></section>
        </aside>
      </section>

      <section class="free-play">
        <div id="free-play-controls"></div>
        <p>These controls use the same reducer.</p>
      </section>
    </main>
