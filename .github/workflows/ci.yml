name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests, architecture checks, migrations, SQL-backed scenario
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build --no-restore --configuration Release

      - name: Validate EF Core migrations generate a consistent SQL script
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script \
            --project src/MultiChannelAgent.Infrastructure \
            --startup-project src/MultiChannelAgent.Infrastructure \
            --idempotent \
            --output "$RUNNER_TEMP/migrations.sql"

      # Docker is preinstalled and running on GitHub-hosted ubuntu runners, so the Testcontainers
      # SQL Server integration test (the SQL-backed application-boundary scenario) runs for real
      # here, alongside the pure unit/application tests and the architecture tests, in one pass.
      # REQUIRE_DOCKER_TESTS=true removes this job's ability to silently skip that scenario: a
      # broken Docker/container startup here fails the build instead of passing as a clean skip.
      - name: Test (unit, application, architecture, SQL-backed application-boundary scenario)
        env:
          REQUIRE_DOCKER_TESTS: "true"
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Web client build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Lint
        working-directory: src/web
        run: npm run lint

      - name: Build
        working-directory: src/web
        run: npm run build
